
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>labs.hdehmel.dev</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #101010;
            font-family: Inter, Helvetica, Arial, sans-serif;
        }

        #game {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        #loader {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #101010;
            color: #f5f5f5;
            opacity: 1;
            transition: opacity 900ms ease;
        }

        #loader.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .brand {
            font-size: clamp(22px, 4vw, 34px);
            font-weight: 500;
            letter-spacing: -1.2px;
        }

        .loading {
            width: min(260px, 65vw);
            margin-top: 42px;
        }

        .track {
            height: 2px;
            background: #303030;
            overflow: hidden;
        }

        #bar {
            width: 0%;
            height: 100%;
            background: #f5f5f5;
            transition: width 180ms ease;
        }

        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 12px;
            color: #777;
            font-size: 10px;
            letter-spacing: 1.2px;
        }

        .footer {
            position: absolute;
            bottom: 30px;
            color: #555;
            font-size: 10px;
            letter-spacing: 1.5px;
        }

        #loader.error {
            color: #ff7777;
        }
    </style>
</head>

<body>
    <canvas id="game"></canvas>

    <div id="loader">
        <div class="brand">labs.hdehmel.dev</div>

        <div class="loading">
            <div class="track">
                <div id="bar"></div>
            </div>

            <div class="details">
                <span id="status">INITIALIZING</span>
                <span id="percentage">0%</span>
            </div>
        </div>

        <div class="footer">
            SHAPE GENERATOR · WEB EDITION
        </div>
    </div>

    <script src="index.js"></script>

    <script>
        const loader = document.getElementById("loader");
        const bar = document.getElementById("bar");
        const percentage = document.getElementById("percentage");
        const status = document.getElementById("status");

        const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":76600,"index.wasm":36160334},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4});

        function updateProgress(current, total) {
            if (total > 0) {
                const progress = Math.min(100, current / total * 100);

                bar.style.width = progress + "%";
                percentage.textContent =
                    Math.round(progress) + "%";

                status.textContent = "LOADING";
            } else {
                status.textContent = "INITIALIZING";
            }
        }

        engine.startGame({
            onProgress: updateProgress
        }).then(() => {
            bar.style.width = "100%";
            percentage.textContent = "100%";
            status.textContent = "READY";

            setTimeout(() => {
                loader.classList.add("hidden");

                setTimeout(() => {
                    loader.remove();
                }, 950);
            }, 250);

        }).catch((error) => {
            console.error(error);
            status.textContent = "FAILED TO LOAD";
            loader.classList.add("error");
        });
    </script>
</body>
</html>
